apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'email-notifications'

    receivers:
      - name: 'email-notifications'
        email_configs:
          - to: 'joshuariveron85@gmail.com'
            from: 'circleguard-alerts@circleguard.com'
            smarthost: 'smtp.gmail.com:587'
            auth_username: 'circleguard-alerts@circleguard.com'
            auth_password: 'SMTP_PASSWORD_HERE'
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'job']
