apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: CircleGuard
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-circleguard
  namespace: monitoring
data:
  circleguard.json: |
    {
      "title": "CircleGuard Services",
      "uid": "circleguard-main",
      "panels": [
        {
          "id": 1,
          "title": "HTTP Requests per Second",
          "type": "timeseries",
          "gridPos": {"x":0,"y":0,"w":12,"h":8},
          "targets": [{
            "expr": "rate(http_server_requests_seconds_count[2m])",
            "legendFormat": "{{job}} - {{uri}}"
          }]
        },
        {
          "id": 2,
          "title": "HTTP Error Rate (5xx)",
          "type": "timeseries",
          "gridPos": {"x":12,"y":0,"w":12,"h":8},
          "targets": [{
            "expr": "rate(http_server_requests_seconds_count{status=~'5..'}[2m])",
            "legendFormat": "{{job}} errors"
          }]
        },
        {
          "id": 3,
          "title": "JVM Heap Used",
          "type": "timeseries",
          "gridPos": {"x":0,"y":8,"w":12,"h":8},
          "targets": [{
            "expr": "jvm_memory_used_bytes{area='heap'}",
            "legendFormat": "{{job}} heap"
          }]
        },
        {
          "id": 4,
          "title": "Auth Logins per Second",
          "type": "stat",
          "gridPos": {"x":12,"y":8,"w":6,"h":8},
          "targets": [{
            "expr": "rate(http_server_requests_seconds_count{job='circleguard-auth',uri='/api/v1/auth/login'}[5m])",
            "legendFormat": "logins/s"
          }]
        },
        {
          "id": 5,
          "title": "Circuit Breaker State",
          "type": "stat",
          "gridPos": {"x":18,"y":8,"w":6,"h":8},
          "targets": [{
            "expr": "resilience4j_circuitbreaker_state{name='auth-service'}",
            "legendFormat": "CB {{name}}"
          }]
        },
        {
          "id": 6,
          "title": "HTTP Latency P99",
          "type": "timeseries",
          "gridPos": {"x":0,"y":16,"w":24,"h":8},
          "targets": [{
            "expr": "histogram_quantile(0.99, rate(http_server_requests_seconds_bucket[5m]))",
            "legendFormat": "{{job}} P99"
          }]
        },
        {
          "id": 7,
          "title": "Negocio: Validaciones de acceso (gate) /s",
          "type": "timeseries",
          "gridPos": {"x":0,"y":24,"w":12,"h":8},
          "targets": [{
            "expr": "sum(rate(http_server_requests_seconds_count{job='circleguard-gateway',uri=~'/api/v1/gate.*'}[5m]))",
            "legendFormat": "validaciones/s"
          }]
        },
        {
          "id": 8,
          "title": "Negocio: Cambios de estado de salud /s",
          "type": "timeseries",
          "gridPos": {"x":12,"y":24,"w":12,"h":8},
          "targets": [{
            "expr": "sum(rate(http_server_requests_seconds_count{job='circleguard-promotion',uri=~'/api/v1/status.*'}[5m]))",
            "legendFormat": "cambios/s"
          }]
        },
        {
          "id": 9,
          "title": "FinOps: CPU solicitada vs asignable del cluster",
          "type": "timeseries",
          "gridPos": {"x":0,"y":32,"w":12,"h":8},
          "targets": [
            {"expr": "sum(kube_pod_container_resource_requests{resource='cpu'})", "legendFormat": "CPU solicitada"},
            {"expr": "sum(kube_node_status_allocatable{resource='cpu'})", "legendFormat": "CPU asignable"}
          ]
        },
        {
          "id": 10,
          "title": "FinOps: Densidad de pods por nodo",
          "type": "stat",
          "gridPos": {"x":12,"y":32,"w":12,"h":8},
          "targets": [{
            "expr": "count(kube_pod_info) / count(count by (node) (kube_pod_info))",
            "legendFormat": "pods/nodo"
          }]
        }
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s"
    }
