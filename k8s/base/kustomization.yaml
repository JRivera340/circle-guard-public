apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# El namespace lo fija cada overlay (dev/staging/prod). La base es agnóstica.

resources:
  # ConfigMaps de aplicación
  - configmap.yaml
  # Microservicios (Deployments + Services)
  - deployments.yaml
  # RBAC: una ServiceAccount, Role y RoleBinding por servicio
  - rbac/service-accounts.yaml
  - rbac/roles.yaml
  - rbac/rolebindings.yaml
  # Network Policies: deny-all + tráfico intra-namespace y DNS
  - network-policies/default-deny.yaml
  - network-policies/allow-intra-namespace.yaml

# Habilita los health groups de Kubernetes (liveness/readiness) en todos los
# servicios; sin esto, /actuator/health/{liveness,readiness} responde 404.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
          value: "true"
